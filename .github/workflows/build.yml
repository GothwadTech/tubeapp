name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Certificate of the release signing key. Once you generate your own keystore,
  # replace this with its SHA-256 digest:
  #   keytool -list -v -keystore release.keystore | grep SHA256
  # The value below is the UPSTREAM Flow key and will not match a new keystore,
  # so "Verify release signing" will fail a signed build until you update it.
  EXPECTED_SIGNER_SHA256: 4322294ed4caa2d4294140095818080ffe8acc1fbe3cdc76107df45c5286be40

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

      - name: Decode keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # A tag build publishes to GitHub Releases. Without the keystore,
            # app/build.gradle.kts falls back to signingConfig = null and produces
            # UNSIGNED artifacts, which cannot be installed.
            echo "::error::RELEASE_KEYSTORE_BASE64 is unavailable for a tag build. Refusing to publish unsigned artifacts."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned CI build."
          fi

      - name: Run unit tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          --max-workers=2 --build-cache --stacktrace

      - name: Compile instrumentation tests
        run: >
          ./gradlew :app:compileGithubDebugAndroidTestKotlin
          --max-workers=2 --build-cache --stacktrace

      # The three artifacts this project ships:
      #   1. app-github-release.apk   universal release APK (GitHub distribution, in-app updater on)
      #   2. app-foss-release.aab     Android App Bundle for Google Play
      #   3. app-github-debug.apk     debug APK for local testing
      #
      # The AAB comes from the `foss` flavour because Google Play rejects apps that
      # update themselves outside the store: the `github` flavour sets
      # UPDATER_ENABLED = true, `foss` sets it to false.
      - name: Build release APK
        run: >
          ./gradlew :app:assembleGithubRelease
          --max-workers=2 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build Play Store bundle
        run: >
          ./gradlew :app:bundleFossRelease
          --max-workers=2 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build debug APK
        run: >
          ./gradlew :app:assembleGithubDebug
          --max-workers=2 --build-cache --stacktrace

      # Guards the update path: a wrong or missing key here is unrecoverable for
      # installed users, so fail the build rather than publish. Skipped when no
      # keystore was available, e.g. on fork PRs.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/github/release/app-github-release*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly 1 release APK in apk/github/release/, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"

          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
            exit 1
          fi
          echo "OK $(basename "$apk") -> $actual"

      - name: Report artifact sizes
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(
            app/build/outputs/apk/github/release/app-github-release*.apk
            app/build/outputs/apk/github/debug/app-github-debug*.apk
            app/build/outputs/bundle/fossRelease/app-foss-release*.aab
          )
          expected=3

          if (( ${#artifacts[@]} != expected )); then
            printf 'Expected %d artifacts, found %d.\n' "$expected" "${#artifacts[@]}" >&2
            printf 'Found: %s\n' "${artifacts[*]}" >&2
            exit 1
          fi

          {
            echo '## Build artifacts'
            echo
            echo '| Artifact | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for a in "${artifacts[@]}"; do
              bytes=$(stat --format='%s' "$a")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$a")" "$size" "$bytes"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-universal-release-apk
          path: app/build/outputs/apk/github/release/app-github-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/fossRelease/app-foss-release*.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: app-*-release-*
          path: dist/
          merge-multiple: true

      - name: Rename artifacts for release
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk=(dist/app-github-release*.apk)
          aab=(dist/app-foss-release*.aab)
          if (( ${#apk[@]} != 1 || ${#aab[@]} != 1 )); then
            echo "::error::Expected 1 APK and 1 AAB in dist/, found ${#apk[@]} APK and ${#aab[@]} AAB" >&2
            exit 1
          fi
          mv "${apk[0]}" dist/gotube.apk
          mv "${aab[0]}" dist/gotube.aab

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gotube.apk gotube.aab > checksums.txt
          cat checksums.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: GoTube ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/gotube.apk
            dist/gotube.aab
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
