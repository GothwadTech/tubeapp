name: Build and release PlusTube

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # Fork PRs have no signing secrets. Assemble the same optimized release
      # variant to catch build/packaging errors, but never upload its unsigned APK.
      - name: Validate release build
        run: ./gradlew :app:assembleGithubRelease --max-workers=2 --build-cache

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # Fail before checkout, Java/Gradle setup or compilation if signing
      # secrets are missing. Never generate a temporary signing key.
      - name: Require release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required to publish an updateable release"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      # No ABI splits, debug APK, FOSS APK or AAB: only one universal APK.
      - name: Build universal release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew :app:assembleGithubRelease --max-workers=2 --build-cache

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/github/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one universal release APK, found ${#apks[@]}"
            exit 1
          fi

          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify "${apks[0]}"

          # Use Gradle's actual APK version for the tag, not a guessed filename.
          metadata=app/build/outputs/apk/github/release/output-metadata.json
          test -f "$metadata"
          read -r version_code version_name < <(python3 - "$metadata" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              elements = json.load(source)["elements"]
          if len(elements) != 1:
              raise SystemExit("Expected exactly one APK in Gradle output metadata")
          print(elements[0]["versionCode"], elements[0]["versionName"])
          PY
          )
          if [ "$version_code" != "$GITHUB_RUN_NUMBER" ] || [ "$version_name" != "1.0.$version_code" ]; then
            echo "::error::APK version must be 1.0.<workflow run number> with the same versionCode"
            exit 1
          fi

          # One versioned universal APK, matching the release tag and in-app updater.
          name="PlusTube-$version_name.apk"
          mkdir -p dist
          cp "${apks[0]}" "dist/$name"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APK: $name; versionCode: $version_code; versionName: $version_name" >> "$GITHUB_STEP_SUMMARY"
          rm -f release.keystore

      - name: Publish this commit
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PlusTube ${{ steps.apk.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/${{ steps.apk.outputs.name }}
